<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boardgame Resultor</title>
    <script>
      // GitHub Pages: support /boardgame-resultor and /boardgame-resultor/
      (function () {
        var path = window.location.pathname;
        if (path === '/boardgame-resultor') {
          window.location.replace(
            '/boardgame-resultor/' +
              window.location.search +
              window.location.hash,
          );
        }
      })();
    </script>
    <script>
      // Apply saved theme/locale before paint to avoid a flash of wrong prefs.
      (function () {
        try {
          var storedTheme = localStorage.getItem('boardgame-resultor-theme');
          var theme =
            storedTheme === 'light' || storedTheme === 'dark'
              ? storedTheme
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          }
          document.documentElement.style.colorScheme = theme;

          var storedLocale = localStorage.getItem('boardgame-resultor-locale');
          if (storedLocale === 'en' || storedLocale === 'zh-TW') {
            document.documentElement.lang = storedLocale;
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
